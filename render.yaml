# Public web application. Private mode remains available by setting this value to false
# and configuring XYZC_PRIVATE_USER / XYZC_PRIVATE_PASSWORD.
services:
  - type: web
    name: concreto-xyzc-privado
    runtime: python
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-web-lock.txt
    startCommand: python -m backend.hosted
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: XYZC_PUBLIC_ACCESS
        value: "true"
      - key: XYZC_PRIVATE_USER
        value: propietario
      - key: XYZC_PRIVATE_PASSWORD
        generateValue: true
